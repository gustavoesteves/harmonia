<div id="wrapper">
    <!-- Main -->
    <div id="main">
        <div class="inner">
            <!-- Menu Selecionado -->
            <div>
                <div *ngIf="menuConfig[0].Status === 'ActiveMenu'">
                    <app-home></app-home>
                </div>
                <div *ngIf="menuConfig[1].Status === 'ActiveMenu'">
                    <app-instruments></app-instruments> 
                </div>
                <div *ngIf="menuConfig[2].Status === 'ActiveMenu'">
                    <app-harmonia></app-harmonia> 
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="inner">
            <!-- Menu -->
            <nav class="menu">
                <header class="major">
                    <h2>Configurações</h2>
                </header>
                <ul>
                    <li><a class={{menuConfig[0].Status}} (click)="changeMenu(0)">Geral</a></li>
                    <li><a class={{menuConfig[1].Status}} (click)="changeMenu(1)">Instrumentos</a></li>
                    <li><a class={{menuConfig[2].Status}} (click)="changeMenu(2)">Harmonia Aplicada</a></li>
                </ul>
                <!-- Footer -->
                <footer id="footer">
                </footer>
            </nav>
        </div>
    </div>
</div>
